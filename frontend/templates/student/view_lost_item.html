<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lost Item Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="card shadow">

<div class="row g-0">

<div class="col-md-5">

{% if item.image %}

<img src="{{ url_for('static', filename='assets/uploads/' + item.image) }}"
class="img-fluid rounded-start"
style="height:100%; object-fit:cover;">

{% else %}

<img src="{{ url_for('static', filename='assets/images/no-image.png') }}"
class="img-fluid rounded-start">

{% endif %}

</div>

<div class="col-md-7">

<div class="card-body">

<h2>{{ item.item_name }}</h2>

<hr>

<p><strong>Category:</strong> {{ item.category }}</p>

<p><strong>Description:</strong> {{ item.description }}</p>

<p><strong>Location:</strong> {{ item.location }}</p>

<p><strong>Lost Date:</strong> {{ item.lost_date }}</p>

<p><strong>Reported By:</strong> {{ item.user.name }}</p>

<p><strong>Status:</strong> {{ item.status }}</p>

<a href="/student/lost_items"
class="btn btn-secondary">

Back

</a>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
