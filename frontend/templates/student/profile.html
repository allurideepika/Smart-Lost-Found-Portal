<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

<div class="container">

<a class="navbar-brand fw-bold text-primary">

<i class="bi bi-box-seam"></i>

Smart Lost & Found

</a>

<div class="ms-auto">

<a href="dashboard.html" class="btn btn-outline-primary">

Dashboard

</a>

</div>

</div>

</nav>

<div class="container py-5">

<div class="profile-card">

<div class="text-center">

<div class="avatar">

<i class="bi bi-person-fill"></i>

</div>

<h3>{{ user.name }}</h3>

<p class="text-muted">
{{ user.department }}
</p>

</div>

<hr>

<div class="row mt-4">

<div class="col-md-6 mb-3">

<label>Name</label>

<input class="form-control" value="{{ user.name }}" readonly>

</div>

<div class="col-md-6 mb-3">

<label>Student ID</label>

<input class="form-control" value="{{ user.roll_no }}" readonly>

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input class="form-control" value="{{ user.email }}" readonly>

</div>

<div class="col-md-6 mb-3">

<label>Phone</label>

<input class="form-control" value="{{ user.phone }}" readonly>

</div>

<div class="col-md-6 mb-3">

<label>Department</label>

<input class="form-control" value="{{ user.department }}" readonly>

</div>

<div class="col-md-6 mb-3">

<label>Year</label>

<input class="form-control" value="{{ user.year }}" readonly>

</div>

</div>

<div class="text-center mt-4">

<!--button class="btn btn-primary flex-fill">

<i class="bi bi-pencil-square"></i>

Edit Profile

</button-->

<a href="/logout" class="btn btn-outline-danger btn-sm px-4">

<i class="bi bi-box-arrow-right"></i>

Logout

</a>

<!-- <i class="bi bi-box-arrow-right"></i-->



</button>

</div>

</div>

</div>

</body>

</html>
