<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Lost Item</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/report_lost.css') }}">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold text-primary"
               href="/student/dashboard">

                <i class="bi bi-box-seam"></i>
                Smart Lost & Found

            </a>

            <div class="ms-auto">

                <a href="/student/dashboard"
                   class="btn btn-outline-primary">

                    Dashboard

                </a>

            </div>

        </div>

    </nav>

    <!-- Main -->
    <div class="container py-5">

        <div class="report-card">

            <h2 class="mb-4">

                <i class="bi bi-search me-2"></i>
                Report Lost Item

            </h2>

            <form
                id="lostForm"
                method="POST"
                action="/student/report_lost"
                enctype="multipart/form-data">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Item Name
                        </label>

                        <input
                            type="text"
                            name="item_name"
                            class="form-control"
                            placeholder="Eg: ID Card"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <select
                            name="category"
                            class="form-select"
                            required>

                            <option value="">Select Category</option>
                            <option value="ID Card">ID Card</option>
                            <option value="Mobile">Mobile</option>
                            <option value="Bag">Bag</option>
                            <option value="Bottle">Bottle</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Books">Books</option>
                            <option value="Others">Others</option>

                        </select>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        rows="4"
                        name="description"
                        class="form-control"
                        placeholder="Describe the lost item"
                        required></textarea>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Lost Date
                        </label>

                        <input
    type="date"
    id="lost_date"
    name="lost_date"
    class="form-control"
    max="{{ today }}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Lost Location
                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            placeholder="Library, Block A..."
                            required>

                    </div>

                </div>

                <!-- Image Upload Section -->
                <div class="mb-4">

                    <label class="form-label">
                        Upload Item Image <span class="text-muted">(Optional)</span>
                    </label>

                    <small class="text-muted d-block mb-3">
                        Uploading an image improves AI matching accuracy.
                        If you don't have one, you can still submit the report.
                    </small>

                    <div class="upload-box" id="uploadBox">

                        <input
                            type="file"
                            id="imageInput"
                            name="image"
                            accept="image/*"
                            hidden>

                        <i class="bi bi-cloud-arrow-up upload-icon"></i>

                        <h5>Click to Upload</h5>

                        <p>or drag & drop an image here</p>

                        <button
                            type="button"
                            class="btn btn-outline-primary"
                            id="chooseBtn">

                            Choose Image

                        </button>

                    </div>

                    <div class="preview-container mt-4">

                        <img id="previewImage" alt="Preview">

                    </div>

                    <!-- Checkbox goes HERE -->
                    <div class="form-check mt-3">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="noImage">

                        <label
                            class="form-check-label"
                            for="noImage">

                            I don't have a photo of the lost item

                        </label>

                    </div>

                </div>

                <button
                    class="btn btn-primary btn-lg w-100"
                    type="submit">

                    Submit Lost Report

                </button>

            </form>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Report Lost JS -->
    <script src="{{ url_for('static', filename='js/report_lost.js') }}"></script>

</body>

</html>
