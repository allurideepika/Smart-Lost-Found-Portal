<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Edit Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    {% with messages = get_flashed_messages() %}
{% if messages %}

    {% for message in messages %}

    <div class="alert alert-success alert-dismissible fade show m-3">

        {{ message }}

        <button
        class="btn-close"
        data-bs-dismiss="alert">
        </button>

    </div>

    {% endfor %}

{% endif %}
{% endwith %}

<div class="container mt-5">

<h2>Edit Student</h2>

<form method="POST">

<div class="mb-3">
<label>Roll Number</label>
<input
type="text"
name="roll_no"
class="form-control"
value="{{ user.roll_no }}"
required>
</div>

<div class="mb-3">
<label>Name</label>
<input
type="text"
name="name"
class="form-control"
value="{{ user.name }}"
required>
</div>

<div class="mb-3">
<label>Email</label>
<input
type="email"
name="email"
class="form-control"
value="{{ user.email }}"
required>
</div>

<div class="mb-3">
<label>Department</label>

<select
name="department"
class="form-select">

<option {% if user.department=="CSE" %}selected{% endif %}>CSE</option>
<option {% if user.department=="ECE" %}selected{% endif %}>ECE</option>
<option {% if user.department=="IT" %}selected{% endif %}>IT</option>
<option {% if user.department=="AI&DS" %}selected{% endif %}>AI&DS</option>
<option {% if user.department=="AIML" %}selected{% endif %}>AIML</option>

</select>

</div>

<div class="mb-3">
<label>Year</label>

<select
name="year"
class="form-select">

<option value="1" {% if user.year==1 %}selected{% endif %}>1st Year</option>
<option value="2" {% if user.year==2 %}selected{% endif %}>2nd Year</option>
<option value="3" {% if user.year==3 %}selected{% endif %}>3rd Year</option>
<option value="4" {% if user.year==4 %}selected{% endif %}>4th Year</option>

</select>

</div>

<div class="mb-3">
<label>Phone</label>
<input
type="text"
name="phone"
class="form-control"
value="{{ user.phone }}"
required>
</div>

<button class="btn btn-success">
Save Changes
</button>

<a href="/admin/manage_users"
class="btn btn-secondary">
Cancel
</a>

</form>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
