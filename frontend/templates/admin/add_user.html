<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Add Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    {% with messages = get_flashed_messages() %}
{% if messages %}

    {% for message in messages %}

    <div class="alert alert-success alert-dismissible fade show m-3">

        {{ message }}

        <button
        class="btn-close"
        data-bs-dismiss="alert">
        </button>

    </div>

    {% endfor %}

{% endif %}
{% endwith %}

<div class="container mt-5">

<h2>Add Student</h2>

<form method="POST">
<div class="mb-3">
    <label>Roll Number</label>
    <input
        type="text"
        name="roll_no"
        class="form-control"
        required>
</div>
<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Department</label>

<select
name="department"
class="form-select"
required>

<option value="">Select Department</option>

<option>CSE</option>
<option>ECE</option>
<option>IT</option>
<option>AI&DS</option>
<option>AIML</option>
</select>

</div>
<div class="mb-3">
    <label>Year</label>

    <select
        name="year"
        class="form-select"
        required>

        <option value="">Select Year</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>

    </select>

</div>
<div class="mb-3">

<label>Phone</label>

<input
type="text"
name="phone"
class="form-control"
required>

</div>
<button class="btn btn-success">

Add Student

</button>

<a href="/admin/manage_users"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
